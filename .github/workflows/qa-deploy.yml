name: Deploy QA

on:
  push:
    branches: [handoff-redesign-fixes]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to QA
        run: |
          git config --global user.email "qa@respire.local"
          git config --global user.name "QA Deploy"
          git fetch origin gh-pages 2>/dev/null || echo "gh-pages branch doesn't exist yet"
          git checkout -b gh-pages origin/gh-pages 2>/dev/null || git checkout --orphan gh-pages

          # Clear and copy QA files
          rm -rf respire-qa
          mkdir -p respire-qa
          cp index.html respire-qa/
          cp style.css respire-qa/
          cp app.js respire-qa/

          git add respire-qa/
          git commit -m "Deploy QA from handoff-redesign-fixes" || echo "No changes to commit"
          git push origin gh-pages
